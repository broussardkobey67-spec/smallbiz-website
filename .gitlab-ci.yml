# Publishes the static site to GitLab Pages on every push to the default branch.
# Live URL: https://broussardkobey67.gitlab.io/smallbiz-website/
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html css js assets public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
